name: Update Star History

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-star-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      REPO_NAME: Sorwcyra/ds-vision-skill
      STAR_HISTORY_SEALED_TOKEN: ${{ secrets.STAR_HISTORY_SEALED_TOKEN }}
      FALLBACK_SEALED_TOKEN: 5xK_NQKmEnXTUliCm0qCDrKXEm1J3YTNpmFmLHRDWwI8IABqNMBPVi7dZHHT8U9BAZkaIkKBSIHY1SA5jUrPLiQ9JNc2G9ScE4SuVyaQT_byn6HeRn_kIg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download chart
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p assets
          token="${STAR_HISTORY_SEALED_TOKEN:-$FALLBACK_SEALED_TOKEN}"
          url="https://api.star-history.com/chart?repos=${REPO_NAME}&type=date&legend=top-left&sealed_token=${token}"
          tmp_file="$(mktemp)"

          for attempt in 1 2 3 4 5 6; do
            echo "Attempt ${attempt}: downloading Star History chart"
            if curl --fail --location --silent --show-error "$url" --output "$tmp_file"; then
              if grep -qi "<svg" "$tmp_file"; then
                mv "$tmp_file" assets/star-history.svg
                echo "Downloaded a valid SVG chart."
                exit 0
              fi
              echo "Downloaded response was not an SVG."
              head -c 200 "$tmp_file" || true
              echo
            fi
            sleep 30
          done

          echo "::warning::Star History did not return a valid SVG. Keeping the existing chart."

      - name: Commit chart
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- assets/star-history.svg; then
            echo "No chart changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.svg
          git commit -m "Update Star History chart"
          git push
